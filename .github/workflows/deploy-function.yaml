# Reusable deploy for function-based apps (ServerlessApp, ServerlessWorker).
# Infrastructure comes from the app's claim in the gitops repository; this workflow
# only ships code. Callers add one job:
#
#   jobs:
#     deploy:
#       needs: [security, test]
#       uses: platform-matuuu60/platform/.github/workflows/deploy-function.yaml@main
#       with:
#         function-name: team-demo-orders
#         artifact-key: orders/latest.zip
#
# It packages `source-dir` reproducibly, uploads it to the key the claim points to,
# and updates the function code if the function already exists.
name: deploy-function

on:
  workflow_call:
    inputs:
      function-name:
        description: Function name in the target account (<namespace>-<app>).
        type: string
        required: true
      artifact-key:
        description: Object key from the claim's spec.artifact.key.
        type: string
        required: true
      artifacts-bucket:
        description: Bucket from the claim's spec.artifact.bucket.
        type: string
        default: idp-artifacts
      source-dir:
        description: Directory packaged as the function root.
        type: string
        default: src

permissions:
  contents: read

jobs:
  deploy:
    # Floci is only reachable from the idp-k3s runners, through its in-cluster Service.
    runs-on: idp-k3s
    timeout-minutes: 10
    env:
      FUNCTION_NAME: ${{ inputs.function-name }}
      ARTIFACT_KEY: ${{ inputs.artifact-key }}
      ARTIFACTS_BUCKET: ${{ inputs.artifacts-bucket }}
      SOURCE_DIR: ${{ inputs.source-dir }}
      AWS_ENDPOINT_URL: http://floci.floci-system.svc.cluster.local:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install AWS CLI
        run: python -m pip install --quiet awscli==1.46.3

      - name: Package
        run: |
          python - <<'PY'
          import os, zipfile
          src = os.environ["SOURCE_DIR"]
          # Fixed timestamps and sorted entries keep the package reproducible.
          with zipfile.ZipFile("package.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(src):
                  dirs.sort()
                  for name in sorted(files):
                      path = os.path.join(root, name)
                      info = zipfile.ZipInfo(os.path.relpath(path, src), date_time=(1980, 1, 1, 0, 0, 0))
                      info.external_attr = 0o644 << 16
                      with open(path, "rb") as fh:
                          zf.writestr(info, fh.read(), zipfile.ZIP_DEFLATED)
          PY
          sha256sum package.zip

      - name: Publish package
        run: aws s3 cp --only-show-errors package.zip "s3://$ARTIFACTS_BUCKET/$ARTIFACT_KEY"

      - name: Update function code
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Function $FUNCTION_NAME does not exist yet: merge the gitops pull request and Crossplane creates it from this package."
            exit 0
          fi
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --s3-bucket "$ARTIFACTS_BUCKET" --s3-key "$ARTIFACT_KEY" \
            --query '{name: FunctionName, sha256: CodeSha256}' --output table
