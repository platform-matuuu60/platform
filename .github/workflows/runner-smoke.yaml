# Proves the self-hosted idp-k3s runners work and that their NetworkPolicy
# allows exactly what CI needs: Floci yes, the Kubernetes API no.
name: runner-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/runner-smoke.yaml
      - kubernetes/arc-runners/**
      - kubernetes/apps/arc-*.yaml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: idp-k3s
    timeout-minutes: 10
    steps:
      # CI must use the Service: hitting 172.18.0.1 directly goes through Docker's
      # DNAT to the container IP, which the runner NetworkPolicy does not allow.
      - name: Floci reachable through its Service
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://floci.floci-system.svc.cluster.local:4566/)
          echo "floci via Service -> HTTP $code"
          [ "$code" != "000" ]

      - name: Kubernetes API is blocked
        run: |
          if curl -sk --max-time 5 https://kubernetes.default.svc/version >/dev/null; then
            echo "runner can reach the Kubernetes API" >&2
            exit 1
          fi
          echo "Kubernetes API blocked as expected"

      - name: Public HTTPS works
        run: curl -fsS --max-time 10 -o /dev/null https://api.github.com/zen && echo "github.com reachable"
