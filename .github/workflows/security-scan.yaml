# Reusable security scan for every repository on the platform (golden path).
# Callers add one job:
#
#   jobs:
#     security:
#       uses: platform-matuuu60/platform/.github/workflows/security-scan.yaml@main
#
# - gitleaks: secrets in the whole git history.
# - trivy fs: vulnerable dependencies, secrets and IaC/Kubernetes misconfigurations.
# Findings at or above `severity` fail the job. Accepted risks go in the caller's
# .trivyignore with a reason. Scanners run as pinned container images, not as
# third-party actions, so a hijacked action tag cannot run in CI.
name: security-scan

on:
  workflow_call:
    inputs:
      severity:
        description: Trivy severities that fail the job.
        type: string
        default: HIGH,CRITICAL

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  gitleaks:
    # GitHub-hosted: the scanners need Docker, which the idp-k3s runners do not have.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Platform gitleaks config
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          [extend]
          useDefault = true

          [[allowlists]]
          description = "Sealed Secrets ciphertext (encrypted for the cluster key, safe to commit)"
          regexTarget = "line"
          regexes = ['''^\s*[\w.-]+:\s+Ag[A-Za-z0-9+/]{200,}={0,2}\s*$''']
          TOML

      - name: Scan git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" -v "$RUNNER_TEMP:/cfg:ro" -w /repo \
            "$GITLEAKS_IMAGE" git --redact --no-banner --config /cfg/gitleaks.toml .

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets and misconfigurations
        env:
          SEVERITY: ${{ inputs.severity }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src "$TRIVY_IMAGE" \
            fs --scanners vuln,secret,misconfig --severity "$SEVERITY" \
            --ignore-unfixed --skip-dirs .git --exit-code 1 .
