# Actions Runner Controller: runs GitHub Actions jobs for the platform-matuuu60 org
# as ephemeral pods in this cluster, so CI can reach in-cluster services such as Floci.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-arc-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.15.1
    helm:
      releaseName: arc-controller
      valuesObject:
        replicaCount: 1
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are larger than the client-side apply annotation limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
