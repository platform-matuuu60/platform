# Syncs every team's requests from the gitops repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopco-gitops-teams
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/platform-matuuu60/gitops.git
    targetRevision: main
    path: teams
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
