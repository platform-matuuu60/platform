# Dedicated Postgres for Backstage. CNPG generates the backstage-db-app secret
# (username, password, host, port, dbname), so no credentials live in git.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-db
  namespace: backstage
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
