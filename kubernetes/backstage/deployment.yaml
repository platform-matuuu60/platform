apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    backstage.io/kubernetes-id: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        backstage.io/kubernetes-id: backstage
    spec:
      serviceAccountName: backstage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          # Pinned by commit; bumped when a new image is published.
          image: ghcr.io/platform-matuuu60/backstage:sha-a7b0ea4d26643bb36e4c06b03649055935a4f806
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: APP_BASE_URL
              value: https://backstage.cloud-it.com.ar
            - name: POSTGRES_HOST
              value: backstage-db-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: backstage
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: backstage-db-app, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: backstage-db-app, key: password }
            - name: KEYCLOAK_METADATA_URL
              value: https://auth.cloud-it.com.ar/realms/idp/.well-known/openid-configuration
            - name: KEYCLOAK_CLIENT_ID
              value: backstage
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: backstage-auth, key: keycloak-client-secret }
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: backstage-auth, key: session-secret }
          readinessProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /.backstage/health/v1/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 80
      targetPort: http
