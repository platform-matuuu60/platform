# Same pattern as the other apps: eg/https with the *.cloud-it.com.ar wildcard
# certificate; external-dns publishes the record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - backstage.cloud-it.com.ar
  rules:
    - backendRefs:
        - name: backstage
          port: 80
