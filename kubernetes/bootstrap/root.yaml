# App of apps for the ShopCo platform. Apply once: kubectl apply -f kubernetes/bootstrap/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopco-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/platform-matuuu60/platform.git
    targetRevision: main
    path: kubernetes/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
