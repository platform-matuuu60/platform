apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresdatabase-cnpg
spec:
  compositeTypeRef:
    apiVersion: platform.idp.internal/v1alpha1
    kind: PostgresDatabase
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $name := $xr.metadata.name }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
              labels:
                backstage.io/kubernetes-id: {{ $name }}
            spec:
              instances: {{ $spec.instances }}
              # Same image as the platform's own clusters; bumped together.
              imageName: ghcr.io/cloudnative-pg/postgresql:17.2
              storage:
                size: {{ $spec.storage }}
              bootstrap:
                initdb:
                  database: {{ $spec.database }}
                  owner: {{ $spec.database }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              inheritedMetadata:
                labels:
                  backstage.io/kubernetes-id: {{ $name }}
            ---
            # Only pods of the same namespace and the CNPG operator reach the database.
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: {{ $name }}-postgres
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: network-policy
                # No status to wait for: ready once applied.
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              podSelector:
                matchLabels:
                  cnpg.io/cluster: {{ $name }}
              policyTypes: [Ingress]
              ingress:
                - from:
                    - podSelector: {}
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: cnpg-system
            ---
            apiVersion: platform.idp.internal/v1alpha1
            kind: PostgresDatabase
            status:
              # CloudNativePG creates this secret with the application credentials.
              secretName: {{ $name }}-app
              host: {{ $name }}-rw.{{ $xr.metadata.namespace }}.svc
    - step: detect-readiness
      functionRef:
        name: function-auto-ready
