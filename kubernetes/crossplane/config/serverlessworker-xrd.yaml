apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: serverlessworkers.platform.idp.internal
spec:
  scope: Namespaced
  group: platform.idp.internal
  names:
    kind: ServerlessWorker
    plural: serverlessworkers
  defaultCompositionRef:
    name: serverlessworker
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: TARGET
          type: string
          jsonPath: .spec.target
        - name: QUEUE
          type: string
          jsonPath: .status.queueName
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: A function that consumes messages from its own queue, with a dead-letter queue.
              required:
                - artifact
              properties:
                target:
                  type: string
                  description: Where the worker runs. Maps to the ClusterProviderConfig of the same name.
                  enum: [floci, aws]
                  default: floci
                runtime:
                  type: string
                  enum: [python3.12, python3.13, nodejs20.x, nodejs22.x]
                  default: python3.12
                handler:
                  type: string
                  default: handler.handler
                memorySize:
                  type: integer
                  minimum: 128
                  maximum: 1024
                  default: 128
                timeout:
                  type: integer
                  description: Function timeout in seconds. The queue visibility timeout is six times this value.
                  minimum: 1
                  maximum: 60
                  default: 10
                batchSize:
                  type: integer
                  description: Messages delivered to the function per invocation.
                  minimum: 1
                  maximum: 10
                  default: 10
                maxReceiveCount:
                  type: integer
                  description: Deliveries of a message before it moves to the dead-letter queue.
                  minimum: 1
                  maximum: 10
                  default: 3
                artifact:
                  type: object
                  description: Function package published by CI to the artifacts bucket.
                  required: [bucket, key]
                  properties:
                    bucket:
                      type: string
                    key:
                      type: string
            status:
              type: object
              properties:
                queueName:
                  type: string
                queueUrl:
                  type: string
                queueArn:
                  type: string
                deadLetterQueueName:
                  type: string
