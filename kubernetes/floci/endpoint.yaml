# In-cluster name for Floci, which runs on the host (docs/adr/0002).
apiVersion: v1
kind: Service
metadata:
  name: floci
  namespace: floci-system
spec:
  ports:
    - name: http
      port: 4566
      targetPort: 4566
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: floci-host
  namespace: floci-system
  labels:
    kubernetes.io/service-name: floci
addressType: IPv4
ports:
  - name: http
    port: 4566
    protocol: TCP
endpoints:
  - addresses:
      - 172.18.0.1
